<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Full-bleed background with rounded corners and ZERO white borders -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#brandGrad)" />
  
  <!-- Subtle Medical Cross Grid -->
  <rect x="236" y="90" width="40" height="332" rx="20" fill="#ffffff" opacity="0.12" />
  <rect x="90" y="236" width="332" height="40" rx="20" fill="#ffffff" opacity="0.12" />

  <!-- Rotated Pill Symbol -->
  <g transform="translate(256, 256) rotate(-45)">
    <path d="M -54,0 L -54,92 C -54,122 -28,146 0,146 C 28,146 54,122 54,92 L 54,0 Z" fill="#ffffff" />
    <path d="M -54,0 L -54,-92 C -54,-122 -28,-146 0,-146 C 28,-146 54,-122 54,-92 L 54,0 Z" fill="url(#pillGrad)" />
    <rect x="-54" y="-6" width="108" height="12" fill="#0284c7" opacity="0.75" rx="3" />
    <path d="M -36,-115 C -44,-100 -44,-60 -44,-20 L -30,-20 C -30,-60 -30,-100 -24,-115 Z" fill="#ffffff" opacity="0.5" />
  </g>

  <!-- Green Medical Plus Badge -->
  <circle cx="396" cy="116" r="48" fill="url(#crossGrad)" />
  <rect x="384" y="92" width="24" height="48" rx="6" fill="#ffffff" />
  <rect x="372" y="104" width="48" height="24" rx="6" fill="#ffffff" />
</svg>
